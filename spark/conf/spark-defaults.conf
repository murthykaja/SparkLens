# SparkLens — Spark defaults
# Mounted into both spark-master and spark-worker containers

spark.eventLog.enabled                    true
spark.eventLog.dir                        file:///opt/spark/logs/events

spark.history.fs.logDirectory             file:///opt/spark/logs/events
spark.history.ui.port                     18080

# Keep AQE OFF for benchmarks so raw waste is visible in the logs
spark.sql.adaptive.enabled                false

# Enough history entries
spark.history.fs.cleaner.enabled          false
